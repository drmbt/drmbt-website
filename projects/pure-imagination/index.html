imagination.jpg","path":"assets/poster/00002_draw_your_imagination.jpg","role":"poster"},{"name":"00003_cloud_painter_beneath_the_sky.jpg","path":"assets/poster/00003_cloud_painter_beneath_the_sky.jpg","role":"poster"},{"name":"00004_a_flower_drawn_by_hand.jpg","path":"assets/poster/00004_a_flower_drawn_by_hand.jpg","role":"poster"}],"hero":{"type":"image","sources":["assets/image/hero.jpg"]},"otherVideos":[{"title":"8K CEILING SKY RENDER","sources":["assets/video/00001_8k_ceiling_sky_render.mp4"],"poster":"assets/video/00001_8k_ceiling_sky_render.mp4#t=0","aspectRatios":["16:9"]},{"title":"CLOUD PAINTER PIPELINE DEMO","sources":["assets/video/00002_cloud_painter_pipeline_demo.mp4"],"poster":"assets/video/00002_cloud_painter_pipeline_demo.mp4#t=0","aspectRatios":["16:9"]}],"carouselImages":["assets/image/00001_the_bloom_room.jpg","assets/image/00002_the_cloud_field.jpg","assets/image/00003_grasses_and_open_sky.jpg","assets/image/00004_the_invitation_wall.jpg","assets/image/00005_kindly_remove_your_shoes.jpg","assets/image/00006_the_drawing_station.jpg","assets/image/00007_tablet_among_the_flowers.jpg","assets/image/00008_a_blank_canvas.jpg","assets/image/00009_silk_flowers_against_the_sky.jpg","assets/image/00010_daylight_on_the_ceiling.jpg","assets/image/00011_a_single_cloud.jpg","assets/image/00012_cirrus_drift.jpg","assets/image/00013_a_cloud_passes_over_the_field.jpg","assets/image/00014_cloud_bloom.jpg","assets/image/00015_a_flower_in_the_clouds.jpg","assets/image/00016_white_bloom_on_lavender.jpg","assets/image/00017_dusk_over_the_room.jpg","assets/image/00018_peach_sky.jpg","assets/image/00019_pale_ceiling.jpg","assets/image/00020_violet_hour.jpg","assets/image/00021_red_flower_and_violet_sky.jpg","assets/image/00022_the_room_goes_pink.jpg","assets/image/00023_visitors_under_the_sky.jpg","assets/image/00024_the_cloud_field_at_play.jpg","assets/image/00025_sitting_in_the_clouds.jpg","assets/image/00026_sunset_over_the_field.jpg","assets/image/00027_last_light.jpg","assets/poster/00001_cloud_painter_tablet_interface.jpg","assets/poster/00002_draw_your_imagination.jpg","assets/poster/00003_cloud_painter_beneath_the_sky.jpg","assets/poster/00004_a_flower_drawn_by_hand.jpg"],"overview":"<p>PURE IMAGINATION was a real-time interactive sky built for the BLOOM exhibition at <a href=\"https://www.hero-nyc.com/\">Hero</a> in New York, a creative challenge brought to me by <a href=\"https://www.spacecowboys.studio/\">Space Cowboys</a>. Visitors — mostly children — lay in a field of white blossoms under a massive 8K LED tile that filled the ceiling of the room. On a tablet at the edge of the field they drew a shape, pressed SUBMIT, and watched it drift overhead as a cloud.</p>\n<p>The brief was deceptively simple and had no off-the-shelf answer: a drawing made by a five-year-old had to become a believable cloud, in a procedurally generated sky, on an 8K canvas, in the time it takes a kid to look up. Nothing in the chain could stall, and nothing could put an unmoderated drawing on a wall in a public exhibition.</p>\n<p>The system I architected ran the whole loop on-site. A custom media server orchestrated the pipeline and drove the ceiling; the drawing interface was built in TouchDesigner; Unreal Engine generated and rendered the sky, running a day-cycle of weather and light across the ceiling tile. Each submitted sketch was sent to an LLM vision model to be read and described — <em>drawing a cloud in the shape of a whale</em> — which both interpreted the child&#39;s intent and filtered anything that shouldn&#39;t make it into the sky. That description drove local Stable Diffusion inference, running on machines in the building, that turned the sketch into a volumetric cloud form. The result was cut out, handed back to Unreal, and released into the sky to be lit and weathered like everything else up there.</p>\n<p>Keeping inference local was a design decision as much as a technical one: it removed the network as a point of failure in a room full of people waiting on their own cloud, and kept the drawings on-premises. Everything in the room ran unattended for the run of the exhibition.</p>\n<p>More documentation in the <a href=\"https://photos.google.com/share/AF1QipOqfAy3rYPZZGwUienSk4bWFhpUsuyQSqNKK--OaKd8Zk7UoJy-FoOHFFp8B3VQ9Q?key=VDZxZ3NHTmpaWHVTMEpTME5ERU12RkJvZzlGSW9B\">original album</a>.</p>\n","descriptionRaw":"\nPURE IMAGINATION was a real-time interactive sky built for the BLOOM exhibition at [Hero](https://www.hero-nyc.com/) in New York, a creative challenge brought to me by [Space Cowboys](https://www.spacecowboys.studio/). Visitors — mostly children — lay in a field of white blossoms under a massive 8K LED tile that filled the ceiling of the room. On a tablet at the edge of the field they drew a shape, pressed SUBMIT, and watched it drift overhead as a cloud.\r\n\r\nThe brief was deceptively simple and had no off-the-shelf answer: a drawing made by a five-year-old had to become a believable cloud, in a procedurally generated sky, on an 8K canvas, in the time it takes a kid to look up. Nothing in the chain could stall, and nothing could put an unmoderated drawing on a wall in a public exhibition.\r\n\r\nThe system I architected ran the whole loop on-site. A custom media server orchestrated the pipeline and drove the ceiling; the drawing interface was built in TouchDesigner; Unreal Engine generated and rendered the sky, running a day-cycle of weather and light across the ceiling tile. Each submitted sketch was sent to an LLM vision model to be read and described — *drawing a cloud in the shape of a whale* — which both interpreted the child's intent and filtered anything that shouldn't make it into the sky. That description drove local Stable Diffusion inference, running on machines in the building, that turned the sketch into a volumetric cloud form. The result was cut out, handed back to Unreal, and released into the sky to be lit and weathered like everything else up there.\r\n\r\nKeeping inference local was a design decision as much as a technical one: it removed the network as a point of failure in a room full of people waiting on their own cloud, and kept the drawings on-premises. Everything in the room ran unattended for the run of the exhibition.\r\n\r\nMore documentation in the [original album](https://photos.google.com/share/AF1QipOqfAy3rYPZZGwUienSk4bWFhpUsuyQSqNKK--OaKd8Zk7UoJy-FoOHFFp8B3VQ9Q?key=VDZxZ3NHTmpaWHVTMEpTME5ERU12RkJvZzlGSW9B).\n","id":"pure-imagination"}
